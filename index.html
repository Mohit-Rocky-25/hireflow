<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#020617" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HireFlow AI — Candidate-First AI Career & ATS Super-Platform. Transparent, private, deterministic resume scanning, JD comparison, offer decoding, and career progression tools." />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self';" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>HireFlow AI — Candidate Career & ATS Intelligence Suite</title>
    <script>
      (function() {
        try {
          var d = localStorage.getItem('hireflow:v4:design') || 'spruce';
          var m = localStorage.getItem('hireflow:v4:theme-mode') || 'light';
          var t = 'light';
          if (d === 'neon-volt') {
            t = 'dark';
          } else if (m === 'system') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } else {
            t = m === 'dark' ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-design', d);
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
